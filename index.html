<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng tuần hoàn hóa học</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%239333ea'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='7' fill='white'/%3E%3Cellipse cx='32' cy='32' rx='22' ry='8' fill='none' stroke='white' stroke-width='3' transform='rotate(-20 32 32)'/%3E%3Cellipse cx='32' cy='32' rx='22' ry='8' fill='none' stroke='white' stroke-width='3' transform='rotate(50 32 32)'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function () {
            var theme = localStorage.getItem("chemistry-theme");
            if (theme !== "light" && theme !== "dark") {
                theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header__inner">
                <div class="header__text">
                    <h1 class="header__title">Bảng tuần hoàn hóa học</h1>
                    <p class="header__subtitle">118 nguyên tố hóa học</p>
                </div>
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Chuyển sang chế độ tối">🌙</button>
            </div>

            <div class="toolbar">
                <input id="search-input" class="toolbar__field toolbar__search" type="search" placeholder="Tìm nguyên tố..." aria-label="Tìm kiếm nguyên tố" autocomplete="off">
                <select id="phase-filter" class="toolbar__field" aria-label="Lọc theo trạng thái">
                    <option value="all">Tất cả trạng thái</option>
                    <option value="Solid">Rắn</option>
                    <option value="Liquid">Lỏng</option>
                    <option value="Gas">Khí</option>
                </select>
                <select id="block-filter" class="toolbar__field" aria-label="Lọc theo block">
                    <option value="all">Tất cả block</option>
                    <option value="s">s</option>
                    <option value="p">p</option>
                    <option value="d">d</option>
                    <option value="f">f</option>
                </select>
                <button id="reset-filters" class="toolbar__reset" type="button" disabled>Xóa lọc</button>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <p id="search-no-result" class="search-no-result" hidden>Không tìm thấy nguyên tố phù hợp.</p>
            <div class="table-scroll">
                <div id="table" class="table"></div>
            </div>
            <div class="series-note">
                <span class="series-note__item"><span class="series-note__swatch cat-lanthanide"></span>Họ Lantan (57–71)</span>
                <span class="series-note__item"><span class="series-note__swatch cat-actinide"></span>Họ Actini (89–103)</span>
            </div>
            <div id="legend" class="legend" hidden></div>

            <div id="error-message" class="error-message" hidden>
                <p class="error-message__text">Không thể tải dữ liệu bảng tuần hoàn. Vui lòng thử lại.</p>
                <button id="retry-button" class="error-message__button" type="button">Thử lại</button>
            </div>
        </div>
    </main>

    <dialog id="element-dialog" class="element-dialog" aria-labelledby="element-dialog-title">
        <button type="button" class="dialog__close" aria-label="Đóng">✕</button>
        <div id="dialog-content" class="dialog__content"></div>
    </dialog>

    <script type="module" src="js/app.js"></script>
</body>
</html>
